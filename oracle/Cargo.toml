[package]
name    = "echogrid-oracle"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
# ── Web server ───────────────────────────────────────────────────────────────
axum            = { version = "0.7", features = ["json"] }
tokio           = { version = "1",   features = ["full"] }
tower           = "0.4"
tower-http      = { version = "0.5", features = ["cors", "trace"] }

# ── Serialisation ────────────────────────────────────────────────────────────
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"

# ── Cryptography — proof verification & signing ──────────────────────────────
sha2            = "0.10"
hex             = "0.4"
ed25519-dalek   = { version = "2.1", features = ["rand_core"] }

# ── Stellar / Soroban SDK & XDR ──────────────────────────────────────────────
stellar-xdr     = { version = "22.0.0", features = ["curr", "std", "base64"] }
stellar-strkey  = "1.0.0"

# ── HTTP Client & RPC ────────────────────────────────────────────────────────
reqwest         = { version = "0.12", features = ["json"] }

# ── Observability ────────────────────────────────────────────────────────────
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# ── Config & Secrets ─────────────────────────────────────────────────────────
dotenvy = "0.15"
secrecy = { version = "0.8", features = ["serde"] }

# ── Error handling ───────────────────────────────────────────────────────────
thiserror = "1"
anyhow    = "1"

[dev-dependencies]
wiremock = "0.6"

[features]
live-network = []
