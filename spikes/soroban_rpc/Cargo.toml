[package]
name = "soroban-rpc-spike"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "soroban_rpc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dotenvy = "0.15"
