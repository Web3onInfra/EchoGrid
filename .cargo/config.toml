# .cargo/config.toml — EchoGrid workspace Cargo configuration

[env]
# Windows/GNU rustc defaults to a small 2 MB stack, which causes STATUS_STACK_BUFFER_OVERRUN (0xc0000409)
# with deeply nested Soroban SDK macro expansion (stellar-xdr, serde_with).
RUST_MIN_STACK = "33554432"

[build]
# Limit jobs to prevent memory allocation / paging exhaustion on Windows
jobs = 2
# Explicitly target the MSVC ABI so that rust-analyzer (and cargo check) always
# analyse against the MSVC stdlib — preventing silent fallback to the GNU target
# which triggers OS error 1455 (paging-file-too-small) when mmap-ing .rmeta files.
# target = "x86_64-pc-windows-msvc"  # Commented out: project uses the GNU toolchain (see rust-toolchain.toml)


