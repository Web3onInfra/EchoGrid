name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      python: ${{ steps.changes.outputs.python }}
      contract: ${{ steps.changes.outputs.contract }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filter
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contract:
              - 'contracts/negawatt_escrow/**'
              - 'scripts/**'
              - 'deployments/**'
              - '.github/workflows/**'
            rust:
              - 'oracle/**'
              - 'acoustic_cli/**'
              - 'spikes/**'
              - 'Cargo.*'
              - '.cargo/**'
              - 'deny.toml'
              - '.github/workflows/**'
            python:
              - 'research/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  rust:
    name: Rust CI
    needs: filter
    if: ${{ needs.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Run cargo-audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python CI
    needs: filter
    if: ${{ needs.filter.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint and Test (or no-op placeholder)
        run: |
          if [ -f "research/hum_detection/pyproject.toml" ]; then
            cd research/hum_detection
            uv run ruff check .
            uv run ruff format --check .
            uv run pytest
          elif [ -f "pyproject.toml" ]; then
            uv run ruff check .
            uv run ruff format --check .
            uv run pytest
          else
            echo "Python project not yet scaffolded (PR 1 baseline passed)."
            exit 0
          fi

  contract:
    name: Contract CI
    needs: filter
    if: ${{ needs.filter.outputs.contract == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "contracts/negawatt_escrow -> contracts/negawatt_escrow/target"

      - name: Check Formatting
        run: cargo fmt --manifest-path contracts/negawatt_escrow/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path contracts/negawatt_escrow/Cargo.toml --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --manifest-path contracts/negawatt_escrow/Cargo.toml

      - name: Build WASM Target
        run: cargo build --manifest-path contracts/negawatt_escrow/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          stellar --version

      - name: Build, Optimize & Enforce Size Budget
        run: bash scripts/build_contract.sh
