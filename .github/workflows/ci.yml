name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      python: ${{ steps.changes.outputs.python }}
      contract: ${{ steps.changes.outputs.contract }}
      app: ${{ steps.changes.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filter
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contract:
              - 'contracts/negawatt_escrow/**'
              - 'scripts/**'
              - 'deployments/**'
              - '.github/workflows/**'
            rust:
              - 'oracle/**'
              - 'acoustic_cli/**'
              - 'spikes/**'
              - 'Cargo.*'
              - '.cargo/**'
              - 'deny.toml'
              - '.github/workflows/**'
            app:
              - 'app/**'
              - '.github/workflows/**'
            python:
              - 'research/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  rust:
    name: Rust CI
    needs: filter
    if: ${{ needs.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Run cargo-audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python CI
    needs: filter
    if: ${{ needs.filter.outputs.python == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint and Test
        run: |
          if [ -f "research/hum_detection/pyproject.toml" ]; then
            cd research/hum_detection
            uv run ruff check .
            uv run ruff format --check .
            uv run pytest
          elif [ -f "pyproject.toml" ]; then
            uv run ruff check .
            uv run ruff format --check .
            uv run pytest
          else
            echo "Python project not yet scaffolded."
            exit 0
          fi

  contract:
    name: Contract CI
    needs: filter
    if: ${{ needs.filter.outputs.contract == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "contracts/negawatt_escrow -> contracts/negawatt_escrow/target"

      - name: Check Formatting
        run: cargo fmt --manifest-path contracts/negawatt_escrow/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path contracts/negawatt_escrow/Cargo.toml --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --manifest-path contracts/negawatt_escrow/Cargo.toml

      - name: Build WASM Target
        run: cargo build --manifest-path contracts/negawatt_escrow/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          stellar --version

      - name: Build, Optimize & Enforce Size Budget
        run: bash scripts/build_contract.sh

  app:
    name: App CI
    needs: filter
    if: ${{ needs.filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Unit Tests
        working-directory: app
        run: npm run test

      - name: Build
        working-directory: app
        run: npm run build

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-all-private
            --exclude "http://localhost.*"
            --exclude "http://127.0.0.1.*"
            --exclude "https://stellar.expert.*"
            --exclude "https://soroban-testnet.stellar.org.*"
            --exclude "https://echogrid-oracle.fly.dev.*"
            --exclude "https://echogrid-pwa.vercel.app.*"
            --exclude "https://echogrid-theoneesi.vercel.app.*"
            --exclude "https://app.echogrid.org.*"
            --exclude "https://staging.echogrid.app.*"
            --exclude "https://echogrid.app.*"
            --exclude "https://horizon-testnet.stellar.org.*"
            --exclude "https://friendbot.stellar.org.*"
            --exclude "file://.*"
            --exclude "mailto:.*"
            README.md docs/**/*.md
          fail: true

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [rust, python, contract, app, link-check]
    if: always()
    steps:
      - name: Verify aggregate status
        run: |
          results="${{ needs.rust.result }} ${{ needs.python.result }} ${{ needs.contract.result }} ${{ needs.app.result }} ${{ needs.link-check.result }}"
          echo "Component job states: $results"
          for res in $results; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "Error: Required component job failed or was cancelled."
              exit 1
            fi
          done
          echo "Unified gate ci-ok PASSED."
