name: Deploy PWA to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint and Typecheck
        working-directory: app
        run: |
          npm run lint
          npm run typecheck

      - name: Run Tests
        working-directory: app
        run: npm run test

      - name: Build PWA Bundle
        working-directory: app
        env:
          VITE_ORACLE_URL: ${{ secrets.VITE_ORACLE_URL || 'https://oracle.echogrid.org' }}
        run: |
          npm run build
          npm run size

      - name: Check Cloudflare Credentials
        id: check_token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "NOTICE: CLOUDFLARE_API_TOKEN is not configured in repository secrets."
            echo "Pre-deployment checks and build succeeded; skipping live Cloudflare Pages deployment."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=echogrid-app
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Smoke Tests on Deployed PWA
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        working-directory: app
        run: |
          node scripts/smoke-test.js "${{ steps.deploy.outputs.deployment-url }}" "${{ secrets.VITE_ORACLE_URL || 'https://oracle.echogrid.org' }}"

      - name: Run Local Preview Smoke Test (Fallback)
        if: ${{ steps.check_token.outputs.has_token != 'true' }}
        working-directory: app
        run: |
          npx vite preview --port 4173 --strictPort &
          PREVIEW_PID=$!
          sleep 2
          node scripts/smoke-test.js http://localhost:4173 --skip-oracle
          kill $PREVIEW_PID
