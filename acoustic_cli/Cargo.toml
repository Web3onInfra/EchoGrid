[package]
name    = "acoustic-cli"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
name = "acoustic_cli"
path = "src/lib.rs"

[[bin]]
name = "acoustic_cli"
path = "src/main.rs"

[dependencies]
clap          = { version = "4", features = ["derive", "env"] }
sha2          = "0.10"
hex           = "0.4"
reqwest       = { version = "0.12", features = ["json", "blocking"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
colored       = "3"
rand          = "0.8"
chrono        = { version = "0.4", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
tokio    = { version = "1", features = ["full"] }
