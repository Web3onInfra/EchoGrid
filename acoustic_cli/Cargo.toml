[package]
name    = "acoustic-cli"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "acoustic_cli"
path = "src/main.rs"

[dependencies]
# CLI argument parsing with coloured help output.
clap    = { version = "4", features = ["derive", "env"] }

# SHA-256 for Proof-of-Power-Down generation.
sha2    = "0.10"
hex     = "0.4"

# HTTP client to POST the proof to the oracle.
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Serialisation for the proof payload.
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# Coloured terminal output — makes the demo visually striking for judges.
colored = "2"

# Random nonce generation.
rand    = "0.8"
